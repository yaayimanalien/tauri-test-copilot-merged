name: Build Daylight apps

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Check and build Windows
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Check Svelte and TypeScript
        run: bun run check

      - name: Test Rust backend
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Windows app and installers
        run: bun run tauri build

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: Daylight-Windows-${{ github.sha }}
          path: |
            src-tauri/target/release/daylight.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  build-linux:
    name: Build Linux app
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            wget

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Check Svelte and TypeScript
        run: bun run check

      - name: Test Rust backend
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Linux package
        run: bun run tauri build --bundles deb

      - name: Upload Linux package
        uses: actions/upload-artifact@v5
        with:
          name: Daylight-Linux-${{ github.sha }}
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 14

  build-macos:
    name: Build macOS app
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Generate platform icons
        run: bun run tauri icon src-tauri/icons/128x128.png

      - name: Check Svelte and TypeScript
        run: bun run check

      - name: Test Rust backend
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build macOS disk image
        run: bun run tauri build --bundles dmg

      - name: Upload macOS disk image
        uses: actions/upload-artifact@v5
        with:
          name: Daylight-macOS-${{ github.sha }}
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

  build-android:
    name: Build Android APK
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Configure Android NDK
        run: echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Generate platform icons
        run: bun run tauri icon src-tauri/icons/128x128.png

      - name: Check Svelte and TypeScript
        run: bun run check

      - name: Initialize Android project
        run: bun run tauri android init --ci

      - name: Build Android APKs
        run: bun run tauri android build --apk --split-per-abi --ci

      - name: Upload Android APKs
        uses: actions/upload-artifact@v5
        with:
          name: Daylight-Android-${{ github.sha }}
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

  build-ios:
    name: Build iOS app
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Generate platform icons
        run: bun run tauri icon src-tauri/icons/128x128.png

      - name: Check Svelte and TypeScript
        run: bun run check

      - name: Test Rust backend
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Initialize iOS project
        run: bun run tauri ios init --ci

      - name: Build unsigned iOS app
        run: bun run tauri ios build --no-sign --ci

  publish-release:
    name: Publish desktop release
    needs: [build-windows, build-linux, build-macos, build-android, build-ios]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows build artifacts
        uses: actions/download-artifact@v5
        with:
          name: Daylight-Windows-${{ github.sha }}
          path: release-assets/windows

      - name: Download Linux build artifacts
        uses: actions/download-artifact@v5
        with:
          name: Daylight-Linux-${{ github.sha }}
          path: release-assets/linux

      - name: Download macOS build artifacts
        uses: actions/download-artifact@v5
        with:
          name: Daylight-macOS-${{ github.sha }}
          path: release-assets/macos

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --generate-notes
          fi
          find release-assets -type f -print0 | xargs -0 -r gh release upload "$GITHUB_REF_NAME" --clobber
